<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Rawan ♡</title>
<meta name="description" content="A little box of letters for Rawan.">
<meta name="theme-color" content="#f6edfb">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="For Rawan">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Great+Vibes&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <div class="floaties" aria-hidden="true"></div>

  <main class="box">
    <p class="greeting" data-greeting="Rawan">Hello, Rawan</p>
    <h1 class="box-title">For Rawan</h1>
    <p class="box-sub">a little box of letters ♡</p>

    <!-- ── the shelf ──────────────────────────────────────────────
         To add the next letter: copy letters/your-name.html, write
         the new poem inside it, then add a card here just like the
         one below (and bump the number).
         ──────────────────────────────────────────────────────── -->
    <div class="shelf">

      <a class="letter-card reveal" href="letters/your-name.html">
        <span class="card-seal" aria-hidden="true">
          <img class="seal-mark" src="assets/seal-r.svg" alt="" width="1098" height="832">
        </span>
        <span class="card-no">Letter No. I</span>
        <span class="card-title">Your Name</span>
        <span class="card-date">July 2026</span>
      </a>

      <div class="letter-card card-soon reveal" aria-hidden="true">
        <span class="sprig">✿</span>
        <span>more to come…</span>
      </div>

    </div>

    <p class="box-foot">kept for you, from Ali</p>

    <aside class="tip" id="tip" hidden>
      <button class="tip-close" type="button" aria-label="Hide this tip">×</button>
      <span class="tip-text"></span>
    </aside>
  </main>

<script src="assets/app.js"></script>
</body>
</html>
